<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>PrintStar Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            margin: 0;
        }

        header {
            background: #0f172a;
            color: #fff;
            padding: 12px 20px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        button {
            padding: 10px 16px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        #print-area {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .item {
            border: 1px solid #ddd;
            padding: 12px;
            background: #fff;
        }

        .item h3 {
            margin: 0 0 6px;
            font-size: 14px;
        }

        .price {
            color: red;
            font-size: 20px;
            font-weight: bold;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<header>
    PRINTSTAR PRO – XUẤT PDF
</header>

<div class="container">
    <button onclick="exportToPDF()">📄 TẢI FILE PDF</button>

    <div id="print-area">
        <!-- Sản phẩm mẫu -->
        <div class="item">
            <h3>Màn hình ViewSonic VA240A</h3>
            <div>24 inch – IPS – 100Hz</div>
            <div class="price">2.050.000 đ</div>
        </div>

        <div class="item">
            <h3>Màn hình Samsung LS24</h3>
            <div>24 inch – IPS – 100Hz</div>
            <div class="price">2.250.000 đ</div>
        </div>

        <div class="item">
            <h3>Webcam Logitech Brio 100</h3>
            <div>Full HD – Auto Focus</div>
            <div class="price">690.000 đ</div>
        </div>

        <div class="item">
            <h3>Màn hình Redmi 1A</h3>
            <div>24 inch – IPS</div>
            <div class="price">1.890.000 đ</div>
        </div>
    </div>
</div>

<script>
async function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const printArea = document.getElementById("print-area");

    if (!printArea || printArea.children.length === 0) {
        alert("Không có dữ liệu để xuất PDF");
        return;
    }

    const pdf = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4"
    });

    await pdf.html(printArea, {
        x: 5,
        y: 5,
        width: 200,
        windowWidth: 1200,
        autoPaging: "text",
        html2canvas: {
            scale: 1,
            useCORS: true,
            allowTaint: true
        }
    });

    pdf.save("bang-gia.pdf");
}
</script>

</body>
</html>
